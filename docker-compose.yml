services:
  postgres:
    image: postgres:15-alpine
    container_name: doc_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_db
      POSTGRES_USER: doc_user
      POSTGRES_PASSWORD: doc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_user -d doc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_intel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: doc_intel_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://doc_user:doc_password@postgres:5432/doc_db
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: doc_intel_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info -c 2
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://doc_user:doc_password@postgres:5432/doc_db
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: doc_intel_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://doc_user:doc_password@postgres:5432/doc_db
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: .
    container_name: doc_intel_flower
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      - redis

  ui:
    build: .
    container_name: doc_intel_ui
    restart: unless-stopped
    command: streamlit run app/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.maxUploadSize=15
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - API_URL=http://api:8000
      - DATABASE_URL=postgresql://doc_user:doc_password@postgres:5432/doc_db
    volumes:
      - ./app:/app/app
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data: